[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spectral-continuation-operator"
version = "0.1.0"
description = "Response-conditioned representations for complex wave systems"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  # Torch 2.9+ wheels currently resolve to a CUDA 13 runtime on this machine,
  # while the installed NVIDIA driver supports the CUDA 12.8 build used here.
  "torch>=2.1,<2.9",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.6"]
simulation = ["deepwave==0.0.26", "h5py>=3.10", "juliacall>=0.9.28"]
coherent = ["scipy>=1.12", "scikit-fmm==2025.6.23"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
